<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suporte do aplicativo Imerva.">
  <link rel="canonical" href="https://imerva.com.br/suporte/">
  <title>Suporte | Imerva</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242033; background: #fbf8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 75% 20%, #e6dcff 0, transparent 36%), #fbf8ff; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 58px); border: 1px solid #eee6f5; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px #36205b16; }
    .brand { color: #4b2c78; font-size: 1.15rem; font-weight: 850; text-decoration: none; }
    h1 { font-size: clamp(2rem, 6vw, 3.3rem); line-height: 1.08; letter-spacing: -.045em; margin: 30px 0 16px; }
    p { color: #625b6d; font-size: 1.05rem; line-height: 1.7; }
    .button { display: inline-flex; margin-top: 12px; padding: 14px 20px; border-radius: 13px; color: #fff; background: #392078; font-weight: 750; text-decoration: none; }
    .button:hover { background: #58329a; }
    .links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 34px; font-size: .94rem; }
    .links a { color: #673b9b; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="../">imerva</a>
    <h1>Como podemos ajudar?</h1>
    <p>Para dúvidas sobre conta, acesso, uso do aplicativo ou seus dados, escreva para nossa equipe de suporte.</p>
    <a class="button" href="mailto:suporte@imerva.com.br">suporte@imerva.com.br</a>
    <div class="links"><a href="../privacidade/">Política de Privacidade</a><a href="../">Página inicial</a></div>
  </main>
</body>
</html>
